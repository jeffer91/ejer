name: CI

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck, unit tests and production build
        run: npm run check
      - name: Security audit
        run: npm run audit
      - name: Validate Cloudflare Pages Functions
        run: npm run cloudflare:check
      - name: Install Chromium for temporary user bot
        run: npx playwright install --with-deps chromium
      - name: Run temporary user bot
        run: npm run bot:check
      - name: Upload bot report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fitness-jeff-bot-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  tauri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install web dependencies
        run: npm ci
      - name: Generate Tauri icons
        run: npm run icons:generate
      - name: Install Linux dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Use stable Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Validate Tauri Rust project
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
